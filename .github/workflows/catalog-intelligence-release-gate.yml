name: Catalog Intelligence Release Gate

on:
  pull_request:
    paths:
      - "server/**"
      - "ingredient-harvester/**"
      - "services/**"
      - "scripts/run_catalog_intelligence_gate.sh"
      - ".github/workflows/catalog-intelligence-release-gate.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install harvester deps
        run: |
          python -m venv .venv-readiness
          . .venv-readiness/bin/activate
          pip install -r ingredient-harvester/requirements.txt

      - name: Run catalog intelligence gate
        run: bash scripts/run_catalog_intelligence_gate.sh
